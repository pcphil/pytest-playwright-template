name: QAT Test Suite

on:
  push:
    branches: [main, develop, init]
  pull_request:
    branches: [main]

# Environment variables — use GitHub Secrets for sensitive data
env:
  HEADLESS: 'true'
  
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps

      - name: Run smoke tests
        run: |
          pytest tests/smoke/ \
            -n auto \
            --reruns 2 \
            -m smoke

      - name: Run integration tests (with retries for flaky tests)
        run: |
          pytest tests/integration/ \
            -n auto \
            --reruns 1 \
            -m "integration" \
            --tb=short

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.python-version }}
          path: test-artifacts/
          retention-days: 7

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.python-version }}
          path: reports/report.html

  caching:
    runs-on: ubuntu-latest
    steps:
      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-
