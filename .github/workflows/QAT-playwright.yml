name: QAT Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps

      - name: Run unit tests
        run: pytest tests/unit/ -v

      - name: Run integration tests with retries
        run: |
          pytest tests/functional/ tests/smoke/ \
            -v \
            --reruns 2 \
            -m "not slow" \
            -n auto

      - name: Run slow tests (single-worker)
        if: always()
        run: pytest tests/functional/ -v -m "slow"

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: screenshots-${{ matrix.python-version }}
          path: test-screenshots/

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: traces-${{ matrix.python-version }}
          path: test-traces/

  caching:
    runs-on: ubuntu-latest
    steps:
      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

env:
  HEADLESS: 'true'
  # ENABLE_TRACE: 'true'  # Uncomment to enable trace collection for all tests
